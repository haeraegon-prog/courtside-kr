name: NBA Korean Daily News

on:
  push:
    branches: [main]
    paths-ignore:
      - data/news.json
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: courtside-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check collection, duplicate, and KST date handling
        run: |
          pip install pytest
          python -m pytest -q
      - name: Verify OpenAI API key is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Add OPENAI_API_KEY under Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
      - name: Collect news & translate Korean briefs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/build_news.py
      - name: Keep history in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh news $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir -p site
          cp index.html site/
          touch site/.nojekyll
          cp -R assets data site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
